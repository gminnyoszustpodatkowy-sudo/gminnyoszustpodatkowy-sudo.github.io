<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clock</title>
    <link rel="stylesheet" href="https://raw.githubusercontent.com/gminnyoszustpodatkowy-sudo/gminnyoszustpodatkowy-sudo.github.io/main/other/fonts/font-faces.css">
    <link rel="stylesheet" href="stylesTZ.css">
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/gminnyoszustpodatkowy-sudo/gminnyoszustpodatkowy-sudo.github.io/main/other/icons/favicon.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="scriptTZ.js" defer></script>
    <script src="timezones.js" defer></script>
</head>

<body>
    <section id="select">
        <section id="selectHead">
            <input id="timeInput" placeholder="HH:MM">
            <input id="dateInput" placeholder="DD-MM-YYYY">
        </section>
        <section id="header">
            <select id="timezone"></select>
            <input type="button" value="Przelicz" onclick="localToSelected()" class="button">
            <!-- <input type="button" value="Przelicz" onclick="selectedToLocal()" class="button"> -->
        </section>


    </section>
    <main>
        <section id="left">
            <p id="localTimeText">Czas lokalny: </p>
            <h3 id="resultDateNow">Dzień tygodnia, dzień miesiąc rok</h3>
            <h1 id="resultHourNow">Godzina</h1>
        </section>
        <section id="right">
            <p id="selectedTimeText">Wybrana strefa czasowa: </p>
            <h3 id="resultDate">Dzień tygodnia, dzień miesiąc rok</h3>
            <h1 id="resultHour">Godzina</h1>
        </section>
    </main>
</body>

</html>
