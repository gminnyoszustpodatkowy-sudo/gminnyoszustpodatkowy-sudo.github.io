<body>
    <main>
        <h3>Dzień tygodnia, dzień miesiąc rok</h3>
        <a href='timer.html'>
            <h1>Godzina</h1>
        </a>
    </main>
    <footer>
        <h6>sekundy</h6>
    </footer>
    <script>
        const dateEl = document.querySelector("h3");
        const timeEl = document.querySelector("h1");
        const secondsEl = document.querySelector("h6");

        const days = ["niedz.", "pon.", "wt.", "śr.", "czw.", "pt.", "sob."];
        const months = [
            "stycznia", "lutego", "marca", "kwietnia", "maja", "czerwca",
            "lipca", "sierpnia", "września", "października", "listopada", "grudnia"
        ];

        function cc() {
            const date = new Date();

            const day = days[date.getDay()];
            const dayDT = date.getDate();
            const month = months[date.getMonth()];
            const year = date.getFullYear();

            let hours = date.getHours();
            let minutes = date.getMinutes().toString().padStart(2, "0");
            let seconds = date.getSeconds().toString().padStart(2, "0");

            dateEl.textContent = `${day}, ${dayDT} ${month} ${year}`;
            timeEl.textContent = `${hours}:${minutes}`;
            secondsEl.textContent = `${hours}:${minutes}:${seconds}`;
        }

        cc();
        setInterval(cc, 1000);
    </script>
