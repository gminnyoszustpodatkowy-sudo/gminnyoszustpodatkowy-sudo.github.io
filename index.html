<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'SF Pro Display', 'Google Sans';
            margin: 0;
            padding: 0;
            background-color: #010101;
            color: white;
        }

        body {
            margin: 25vh 30px 0px 30px;
        }

        main {
            text-align: center;
            height: 70vh;
        }

        h3 {
            font-weight: 500;
            font-size: 3em;
        }

        h1 {
            font-weight: 700;
            font-size: 12em;
        }

        footer {
            height: 4vh;
            text-align: center;
        }

        h6 {
            font-weight: 500;
            font-size: 1em;
        }

        @media(max-width: 400px) {
            main {
                text-align: center;
                height: 90vh;
            }

            h3 {
                font-weight: 500;
                font-size: 1.5em;
            }

            h1 {
                font-weight: 700;
                font-size: 6em;
            }

            footer {
                height: 4vh;
                display: none;
            }
        }
    </style>
</head>

<body>
    <main>
        <h3>Dzień tygodnia, dzień miesiąc rok</h3>
        <h1>Godzina</h1>
    </main>
    <footer>
        <h6>sekundy</h6>
    </footer>
    <script>
        function cc() {
            let date = new Date();
            let day = date.getDay();
            let dayDT = date.getDate();
            let month = date.getMonth();
            let year = date.getFullYear();
            switch (day) {
                case 1: day = 'pon.'; break;
                case 2: day = 'wt.'; break;
                case 3: day = 'śr.'; break;
                case 4: day = 'czw.'; break;
                case 5: day = 'pt.'; break;
                case 6: day = 'sob'; break;
                case 7: day = 'niedz.'; break;
                default: day = '';
            }
            switch (month) {
                case 0: month = 'stycznia'; break;
                case 1: month = 'lutego'; break;
                case 2: month = 'marca'; break;
                case 3: month = 'kwietnia'; break;
                case 4: month = 'maja'; break;
                case 5: month = 'czerwca'; break;
                case 6: month = 'lipca'; break;
                case 7: month = 'sierpnia'; break;
                case 8: month = 'września'; break;
                case 9: month = 'października'; break;
                case 10: month = 'listopada'; break;
                case 11: month = 'grudnia'; break;
                default: month = '';
            }

            let hours = date.getHours();
            let minutes = date.getMinutes();
            let seconds = date.getSeconds();
            if (minutes < 10) { minutes = `0${minutes}` }
            if (seconds < 10) { seconds = `0${seconds}` }
            document.querySelector('h3').innerHTML = `${day}, ${dayDT} ${month} ${year}`;
            document.querySelector('h1').innerHTML = `${hours}:${minutes}`;
            document.querySelector('h6').innerHTML = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(cc, 1)
    </script>
</body>

</html>
