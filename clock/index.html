<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clock</title>
    <link rel="stylesheet" href="https://raw.githubusercontent.com/gminnyoszustpodatkowy-sudo/gminnyoszustpodatkowy-sudo.github.io/main/other/fonts/font-faces.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/gminnyoszustpodatkowy-sudo/gminnyoszustpodatkowy-sudo.github.io/main/other/icons/favicon.png" type="image/x-icon">
</head>

<body>
    <main>
        <h3>Dzień tygodnia, dzień miesiąc rok</h3>
        <h1>Godzina</h1>
    </main>
    <footer>
        <h6>sekundy</h6>
    </footer>
    <script>
        const dateEl = document.querySelector("h3");
        const timeEl = document.querySelector("h1");
        const secondsEl = document.querySelector("h6");

        const days = ["niedz.", "pon.", "wt.", "śr.", "czw.", "pt.", "sob."];
        const months = [
            "stycznia", "lutego", "marca", "kwietnia", "maja", "czerwca",
            "lipca", "sierpnia", "września", "października", "listopada", "grudnia"
        ];

        function cc() {
            const date = new Date();

            const day = days[date.getDay()];
            const dayDT = date.getDate();
            const month = months[date.getMonth()];
            const year = date.getFullYear();

            let hours = date.getHours();
            let minutes = date.getMinutes().toString().padStart(2, "0");
            let seconds = date.getSeconds().toString().padStart(2, "0");

            dateEl.textContent = `${day}, ${dayDT} ${month} ${year}`;
            timeEl.textContent = `${hours}:${minutes}`;
            secondsEl.textContent = `${hours}:${minutes}:${seconds}`;
        }

        cc();
        setInterval(cc, 1000);
    </script>
</body>



</html>
